name: Refresh audited dependencies

on:
  push:
    branches: [qa-final-v0.8.2]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: qa-final-v0.8.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade vulnerable packages inside existing major versions
        run: |
          npm install --save-exact @capacitor/core@7.6.9 react-router-dom@7.18.4
          npm install --save-dev --save-exact @capacitor/cli@7.6.9 vite@7.3.6
          npm audit --audit-level=high
          npm run build

      - name: Commit refreshed lockfile and remove one-time workflow
        run: |
          rm .github/workflows/dependency-refresh.yml
          git config user.name "Northborn QA"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/dependency-refresh.yml
          git commit -m "Upgrade audited dependencies"
          git push origin HEAD:qa-final-v0.8.2
