name: Northborn CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Northborn
        run: npm run build

      - name: Upload compiled preview
        uses: actions/upload-artifact@v4
        with:
          name: northborn-dist
          path: dist
          retention-days: 2
