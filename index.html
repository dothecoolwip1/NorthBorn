<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Northborn" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/northborn-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/northborn-icon.svg" />
    <title>Northborn</title>
    <script>
      ;(() => {
        const freshHomeUrl = () => {
          let basePath = '/'
          if (window.location.hostname.endsWith('github.io')) {
            const firstSegment = window.location.pathname.split('/').filter(Boolean)[0]
            if (firstSegment) basePath = `/${firstSegment}/`
          }
          const url = new URL(basePath, window.location.origin)
          url.searchParams.set('_northborn', Date.now().toString())
          return url.toString()
        }

        const clearBrowserAppCaches = async () => {
          try {
            if ('caches' in window) {
              const keys = await caches.keys()
              await Promise.all(keys.map(key => caches.delete(key)))
            }
          } catch {}
          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations()
              await Promise.all(registrations.map(registration => registration.unregister()))
            }
          } catch {}
        }

        const showRecovery = (reason = 'Northborn could not start correctly.') => {
          if (document.documentElement.dataset.northbornMounted === '1') return
          const root = document.getElementById('root')
          if (!root) return
          document.body.style.margin = '0'
          document.body.style.background = '#081019'
          root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#081019;color:#eef2f7;font-family:system-ui,sans-serif"><div style="width:min(430px,100%);padding:28px;border-radius:20px;border:1px solid #26364b;background:#101923;text-align:center"><div style="font-size:28px;font-weight:900;margin-bottom:10px;color:#d58a34">N</div><h1 style="margin:0 0 10px;font-size:24px">Northborn could not start</h1><p id="northborn-recovery-reason" style="margin:0 0 18px;color:#96a3b5;line-height:1.5"></p><button id="northborn-reload-latest" style="width:100%;min-height:48px;padding:12px 16px;border:0;border-radius:12px;background:#d58a34;color:#17120b;font-weight:800">Retry Northborn</button><p id="northborn-reload-status" style="display:none;margin:12px 0 0;color:#96a3b5;font-size:13px">Loading a fresh copy of Northborn…</p></div></div>'
          const reasonEl = document.getElementById('northborn-recovery-reason')
          if (reasonEl) reasonEl.textContent = reason
          document.getElementById('northborn-reload-latest')?.addEventListener('click', async event => {
            const button = event.currentTarget
            const status = document.getElementById('northborn-reload-status')
            if (button) {
              button.disabled = true
              button.textContent = 'Retrying…'
            }
            if (status) status.style.display = 'block'
            await clearBrowserAppCaches()
            window.location.replace(freshHomeUrl())
          })
        }

        window.addEventListener('error', event => {
          const target = event.target
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            showRecovery('A required Northborn app file failed to load. This can happen briefly during a new deployment.')
          }
        }, true)

        window.addEventListener('load', () => {
          window.setTimeout(() => {
            if (document.documentElement.dataset.northbornMounted !== '1') {
              showRecovery('Northborn is taking longer than expected to start. Retry once to load a fresh copy.')
            }
          }, 15000)
        })
      })()
    </script>
    <script>
      ;(() => {
        const iconLabels = [
          ['lucide-pencil', 'Edit'],
          ['lucide-trash-2', 'Delete'],
          ['lucide-trash', 'Delete'],
          ['lucide-x', 'Close'],
          ['lucide-copy', 'Copy'],
          ['lucide-refresh-cw', 'Refresh'],
          ['lucide-eye', 'Preview'],
          ['lucide-archive', 'Archive'],
          ['lucide-menu', 'Open menu'],
          ['lucide-search', 'Search'],
          ['lucide-filter', 'Filter'],
          ['lucide-plus', 'Add'],
          ['lucide-chevron-left', 'Previous'],
          ['lucide-chevron-right', 'Next'],
          ['lucide-download', 'Download'],
          ['lucide-printer', 'Print'],
        ]

        const enhanceAccessibility = root => {
          const scope = root && root.querySelectorAll ? root : document
          scope.querySelectorAll('input[type="password"],input[data-northborn-password="true"]').forEach(input => {
            if (!input.getAttribute('aria-label')) input.setAttribute('aria-label', 'Password')
          })
          scope.querySelectorAll('button').forEach(button => {
            if ((button.getAttribute('aria-label') || '').trim()) return
            if ((button.getAttribute('title') || '').trim()) return
            if ((button.textContent || '').trim()) return
            const svg = button.querySelector('svg')
            if (!svg) return
            const classes = svg.getAttribute('class') || ''
            const match = iconLabels.find(([className]) => classes.includes(className))
            if (!match) return
            button.setAttribute('aria-label', match[1])
            button.setAttribute('title', match[1])
          })
        }

        const start = () => {
          enhanceAccessibility(document)
          const observer = new MutationObserver(records => {
            records.forEach(record => record.addedNodes.forEach(node => {
              if (node.nodeType === 1) enhanceAccessibility(node)
            }))
            enhanceAccessibility(document)
          })
          observer.observe(document.documentElement, { childList: true, subtree: true })
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true })
        else start()
      })()
    </script>
  </head>
  <body>
    <div id="root" style="min-height:100vh;background:#081019"></div>
    <script src="/mallard-numbering-ui.js"></script>
    <script src="/mallard-field-cleanup.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
