name: Northborn Production QA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_qa:
        description: Run legacy functional QA against an explicitly enabled QA deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # This suite changes the shared functional manager role in Supabase.
  # Serialize it with Northborn CI so role assertions cannot race each other.
  group: northborn-functional-account-qa
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify production release and public routes
        run: node scripts/production-smoke.mjs

  production-qa:
    if: github.event_name == 'workflow_dispatch' && inputs.live_qa
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enforce Northborn version rule
        id: version_guard
        run: |
          node scripts/version-guard.mjs
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install application dependencies
        run: npm ci


      - name: Build production bundle
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.63.0
          npx playwright install --with-deps chromium

      - name: Wait for matching production deployment
        env:
          EXPECTED_VERSION: ${{ steps.version_guard.outputs.version }}
        run: |
          for attempt in $(seq 1 48); do
            body="$(curl -fsS "https://dothecoolwip1.github.io/NorthBorn//release.json?qa=${GITHUB_SHA}-${attempt}" || true)"
            if echo "$body" | grep -q "\"version\": \"${EXPECTED_VERSION}\""; then
              echo "Production is running Northborn v${EXPECTED_VERSION}."
              exit 0
            fi
            sleep 5
          done
          echo "Production never reported Northborn v${EXPECTED_VERSION}."
          exit 1

      - name: Run segmented production browser QA
        env:
          NORTHBORN_BASE_URL: https://dothecoolwip1.github.io/NorthBorn/
          NORTHBORN_VERSION: ${{ steps.version_guard.outputs.version }}
        run: node scripts/run-browser-qa-groups.mjs

      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northborn-production-qa-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
