<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Northborn</title>
    <script>
      ;(() => {
        const recoveryKey = 'northborn_boot_recovery_once'
        const rootReady = () => {
          const root = document.getElementById('root')
          return Boolean(root && root.childElementCount > 0)
        }
        const clearRecovery = () => {
          try { sessionStorage.removeItem(recoveryKey) } catch {}
        }
        const freshHomeUrl = () => {
          let basePath = '/'
          if (window.location.hostname.endsWith('github.io')) {
            const firstSegment = window.location.pathname.split('/').filter(Boolean)[0]
            if (firstSegment) basePath = `/${firstSegment}/`
          }
          const url = new URL(basePath, window.location.origin)
          url.searchParams.set('_northborn', Date.now().toString())
          return url.toString()
        }
        const clearBrowserAppCaches = async () => {
          try {
            if ('caches' in window) {
              const keys = await caches.keys()
              await Promise.all(keys.map(key => caches.delete(key)))
            }
          } catch {}
          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations()
              await Promise.all(registrations.map(registration => registration.unregister()))
            }
          } catch {}
        }
        const loadLatest = async () => {
          clearRecovery()
          await clearBrowserAppCaches()
          window.location.assign(freshHomeUrl())
        }
        const showRecovery = () => {
          const root = document.getElementById('root')
          if (!root || rootReady()) return
          document.body.style.margin = '0'
          document.body.style.background = '#081019'
          root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#081019;color:#eef2f7;font-family:system-ui,sans-serif"><div style="width:min(430px,100%);padding:28px;border-radius:20px;border:1px solid #26364b;background:#101923;text-align:center"><div style="font-size:28px;font-weight:900;margin-bottom:10px;color:#d58a34">N</div><h1 style="margin:0 0 10px;font-size:24px">Northborn needs a refresh</h1><p style="margin:0 0 18px;color:#96a3b5;line-height:1.5">A newer test build was published while this browser still had an older copy open.</p><button id="northborn-reload-latest" style="width:100%;min-height:48px;padding:12px 16px;border:0;border-radius:12px;background:#d58a34;color:#17120b;font-weight:800">Load latest version</button><p id="northborn-reload-status" style="display:none;margin:12px 0 0;color:#96a3b5;font-size:13px">Clearing the old app files and loading the newest build…</p></div></div>'
          document.getElementById('northborn-reload-latest')?.addEventListener('click', async event => {
            const button = event.currentTarget
            const status = document.getElementById('northborn-reload-status')
            if (button) {
              button.disabled = true
              button.textContent = 'Loading latest version…'
            }
            if (status) status.style.display = 'block'
            await loadLatest()
          })
        }
        const recover = () => {
          if (rootReady()) return
          try {
            if (sessionStorage.getItem(recoveryKey) === '1') {
              showRecovery()
              return
            }
            sessionStorage.setItem(recoveryKey, '1')
          } catch {}
          window.location.assign(freshHomeUrl())
        }

        window.addEventListener('error', event => {
          const target = event.target
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) recover()
        }, true)

        window.addEventListener('DOMContentLoaded', () => {
          const root = document.getElementById('root')
          if (root) {
            const observer = new MutationObserver(() => {
              if (root.childElementCount > 0) {
                clearRecovery()
                observer.disconnect()
              }
            })
            observer.observe(root, { childList: true, subtree: true })
          }
        })

        window.addEventListener('load', () => {
          window.setTimeout(() => {
            if (!rootReady()) recover()
            else clearRecovery()
          }, 2200)
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
