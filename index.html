<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Northborn</title>
    <script>
      ;(() => {
        const freshHomeUrl = () => {
          let basePath = '/'
          if (window.location.hostname.endsWith('github.io')) {
            const firstSegment = window.location.pathname.split('/').filter(Boolean)[0]
            if (firstSegment) basePath = `/${firstSegment}/`
          }
          const url = new URL(basePath, window.location.origin)
          url.searchParams.set('_northborn', Date.now().toString())
          return url.toString()
        }

        const clearBrowserAppCaches = async () => {
          try {
            if ('caches' in window) {
              const keys = await caches.keys()
              await Promise.all(keys.map(key => caches.delete(key)))
            }
          } catch {}
          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations()
              await Promise.all(registrations.map(registration => registration.unregister()))
            }
          } catch {}
        }

        const showRecovery = (reason = 'Northborn could not start correctly.') => {
          if (document.documentElement.dataset.northbornMounted === '1') return
          const root = document.getElementById('root')
          if (!root) return
          document.body.style.margin = '0'
          document.body.style.background = '#081019'
          root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#081019;color:#eef2f7;font-family:system-ui,sans-serif"><div style="width:min(430px,100%);padding:28px;border-radius:20px;border:1px solid #26364b;background:#101923;text-align:center"><div style="font-size:28px;font-weight:900;margin-bottom:10px;color:#d58a34">N</div><h1 style="margin:0 0 10px;font-size:24px">Northborn could not start</h1><p id="northborn-recovery-reason" style="margin:0 0 18px;color:#96a3b5;line-height:1.5"></p><button id="northborn-reload-latest" style="width:100%;min-height:48px;padding:12px 16px;border:0;border-radius:12px;background:#d58a34;color:#17120b;font-weight:800">Retry Northborn</button><p id="northborn-reload-status" style="display:none;margin:12px 0 0;color:#96a3b5;font-size:13px">Loading a fresh copy of Northborn…</p></div></div>'
          const reasonEl = document.getElementById('northborn-recovery-reason')
          if (reasonEl) reasonEl.textContent = reason
          document.getElementById('northborn-reload-latest')?.addEventListener('click', async event => {
            const button = event.currentTarget
            const status = document.getElementById('northborn-reload-status')
            if (button) {
              button.disabled = true
              button.textContent = 'Retrying…'
            }
            if (status) status.style.display = 'block'
            await clearBrowserAppCaches()
            window.location.replace(freshHomeUrl())
          })
        }

        window.addEventListener('error', event => {
          const target = event.target
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            showRecovery('A required Northborn app file failed to load. This can happen briefly during a new deployment.')
          }
        }, true)

        window.addEventListener('load', () => {
          window.setTimeout(() => {
            if (document.documentElement.dataset.northbornMounted !== '1') {
              showRecovery('Northborn is taking longer than expected to start. Retry once to load a fresh copy.')
            }
          }, 15000)
        })
      })()
    </script>
  </head>
  <body>
    <div id="root" style="min-height:100vh;background:#081019"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
