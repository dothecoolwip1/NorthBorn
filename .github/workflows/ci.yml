name: Northborn CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # This suite changes the shared functional manager role in Supabase.
  # Serialize it with Production QA so the two browser suites cannot change
  # the same test identity at the same time.
  group: northborn-functional-account-qa
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Northborn version discipline
        run: node scripts/version-guard.mjs

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build Northborn
        run: npm run build

      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.63.0
          npx playwright install chromium

      - name: Start compiled Northborn preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/northborn-preview.log 2>&1 &
          echo $! > /tmp/northborn-preview.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/northborn-preview.log
          exit 1

      - name: Run role, auth, navigation and mobile browser QA
        env:
          NORTHBORN_BASE_URL: http://127.0.0.1:4173
        run: |
          export NORTHBORN_VERSION="$(node -p "require('./package.json').version")"
          npx playwright test tests/e2e/production-smoke.spec.mjs --workers=1 --reporter=line --timeout=120000

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: northborn-pr-browser-qa
          path: |
            test-results
            playwright-report
            /tmp/northborn-preview.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload compiled preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northborn-dist
          path: dist
          retention-days: 2
