name: Northborn Pull Request QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: northborn-pr-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci


      - name: Type-check and build
        run: npm run build
